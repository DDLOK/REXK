# ============================================================
# server.cfg - ollie's bench fivem server
# ============================================================

# --- endpoints (local hosting on 30120) ---
endpoint_add_tcp "0.0.0.0:${SERVER_PORT}"
endpoint_add_udp "0.0.0.0:${SERVER_PORT}"

# --- core resources (chat lives here) ---
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure rconlog
ensure yarn
ensure webpack
ensure fivem
ensure fivem-map-skater

# --- ollie's bench custom pack ---
ensure chat_ollie
ensure account_ollie
ensure house_ollie
ensure spawn_ollie
ensure admin_ollie
ensure menu_ollie

# --- identity ---
sv_hostname "^1ollie's ^7bench ^3^| ^2fivem ^7dev"
sv_maxclients 32
sv_scriptHookAllowed 0
sv_enforceGameBuild 2802

# --- license key ---
# UNCOMMENT and paste your key if the panel has no LICENSE_KEY variable.
# Get one at https://keymaster.fivem.net (tier: whatever your host IP qualifies as)
# sv_licenseKey "cfxk_YOUR_KEY_HERE"

# --- convars ---
set sv_enhancedHostSupport 1
# onesync is auto-on with modern builds; configure at https://portal.cfx.re/

# --- admin: after first connect, run `whoami` in console, paste identifier ---
add_ace group.admin command allow
add_ace group.admin command.quit deny
# add_principal identifier.license:YOUR_LICENSE_HEX group.admin
