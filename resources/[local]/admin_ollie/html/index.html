<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<div id="root" style="display:none">
    <div class="bg"></div>
    <div class="panel">
        <header>
            <h1><span class="dot"></span>ADMIN<small>PANEL</small></h1>
            <div class="actions-top">
                <button id="refresh">↻</button>
                <button id="close">✕</button>
            </div>
        </header>

        <input id="search" type="text" placeholder="search by id, name, account...">

        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>NAME</th><th>ACCOUNT</th><th>JOB</th><th>CASH</th><th>ACTIONS</th></tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <footer>
            <span>SAN VALLY STATE · admin</span>
        </footer>
    </div>

    <!-- action modal -->
    <div id="modal" class="modal" style="display:none">
        <div class="modal-card">
            <h3 id="modal-title">Action</h3>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button id="modal-cancel">cancel</button>
                <button id="modal-ok" class="primary">confirm</button>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body></html>
