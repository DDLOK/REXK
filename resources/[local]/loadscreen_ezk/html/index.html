<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EZK TEAM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
        <div class="grid"></div>
    </div>

    <main class="stage">
        <header class="brand">
            <h1 class="logo">
                <span class="e">E</span><span class="z">Z</span><span class="k">K</span>
                <span class="team">TEAM</span>
            </h1>
            <p class="tag">freeroam · built different</p>
        </header>

        <section class="status">
            <div class="step" id="step">booting the city</div>
            <div class="bar">
                <div class="fill" id="fill"></div>
                <div class="shine"></div>
            </div>
            <div class="meta">
                <span id="pct">0%</span>
                <span id="hint">loading world data</span>
            </div>
        </section>

        <section class="facts">
            <div class="fact">
                <span class="k">SERVER</span>
                <span class="v" id="hostname">EZK TEAM</span>
            </div>
            <div class="fact">
                <span class="k">SLOTS</span>
                <span class="v" id="slots">— / —</span>
            </div>
            <div class="fact">
                <span class="k">PING</span>
                <span class="v" id="ping">—</span>
            </div>
        </section>

        <section class="tips">
            <div class="tip" id="tip">press F5 once in game for the main menu</div>
        </section>

        <footer class="credit">
            <span>made by</span>
            <strong>EZK TEAM</strong>
            <span class="dot">·</span>
            <span>discord.gg/ojailbreaks</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
